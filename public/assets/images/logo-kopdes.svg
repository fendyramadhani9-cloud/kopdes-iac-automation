<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="100%" height="100%" fill="none">
    <!-- Tiang Bendera -->
    <circle cx="166" cy="28" r="4.5" fill="#94a3b8" />
    <line x1="166" y1="28" x2="166" y2="70" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />

    <!-- Bendera Merah Putih Berkibar -->
    <!-- Bagian Merah (Atas) -->
    <path d="M 122 34 Q 138 24, 150 36 Q 158 42, 166 32 L 166 46 Q 158 56, 150 50 Q 138 38, 122 48 Z" fill="#c81e2b" />
    <!-- Bagian Putih (Bawah) -->
    <path d="M 122 48 Q 138 38, 150 50 Q 158 56, 166 46 L 166 60 Q 158 70, 150 64 Q 138 52, 122 62 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.8" />

    <!-- Garis Atap & Kerangka Rumah Merah -->
    <!-- Atap Kiri dan Dinding Kiri Menuju Garis Dasar -->
    <path d="M 166 70 
             L 62 138 
             Q 52 144, 46 138 
             L 42 134 
             L 60 120 
             L 166 50 
             Z" fill="#c81e2b" />

    <!-- Tiang Atap Kanan Vertikal melengkung elegan -->
    <path d="M 166 50
             L 172 65
             L 172 165
             Q 172 178, 160 178
             L 155 178
             Q 155 160, 155 78
             Z" fill="#c81e2b" />

    <!-- Dinding Kiri dan Garis Pondasi Bawah -->
    <path d="M 46 138
             L 68 138
             L 68 206
             L 310 206
             Q 316 206, 316 214
             Q 316 222, 310 222
             L 56 222
             Q 46 222, 46 212
             Z" fill="#c81e2b" />

    <!-- Jendela 4 Kotak (Soft Slate / Silver) -->
    <rect x="88" y="148" width="13" height="13" rx="2" fill="#cbd5e1" />
    <rect x="105" y="148" width="13" height="13" rx="2" fill="#cbd5e1" />
    <rect x="88" y="165" width="13" height="13" rx="2" fill="#cbd5e1" />
    <rect x="105" y="165" width="13" height="13" rx="2" fill="#cbd5e1" />

    <!-- Tipografi KOP DES MERAH PUTIH -->
    <g font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
        <!-- KOP -->
        <text x="178" y="112" font-size="52" font-weight="900" fill="#c81e2b" letter-spacing="1">KOP</text>

        <!-- DES -->
        <text x="178" y="168" font-size="62" font-weight="900" fill="#c81e2b" letter-spacing="0">DES</text>

        <!-- MERAH PUTIH -->
        <text x="180" y="196" font-size="16.5" font-weight="800" fill="#0f172a" letter-spacing="1.2">MERAH PUTIH</text>
    </g>
</svg>
