---
# ==============================================================================
# Role: HAProxy (Load Balancer on Windows HAProxy Node 192.168.X.10)
# ==============================================================================

- name: Pastikan direktori HAProxy dan tool service tersedia
  ansible.windows.win_file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ haproxy_dest_dir }}"
    - "{{ tools_dir }}\\nssm"
    - "{{ cache_dir }}"

# =====================================================
# 1. Setup Binary HAProxy
# =====================================================
- name: Cek apakah binary haproxy.exe sudah terpasang
  ansible.windows.win_stat:
    path: "{{ haproxy_dest_dir }}\\haproxy.exe"
  register: haproxy_bin_check

- name: Salin arsip HAProxy dari Controller (jika tersedia lokal)
  ansible.windows.win_copy:
    src: "files/haproxy.zip"
    dest: "{{ cache_dir }}\\haproxy.zip"
  when: not haproxy_bin_check.stat.exists
  ignore_errors: true
  register: local_haproxy_zip

- name: Unduh HAProxy for Windows jika file lokal tidak tersedia di Controller
  ansible.windows.win_shell: |
    $url = "https://github.com/haproxytech/haproxy/releases"
    # Fallback portable build untuk lab Windows
    $dest = "{{ cache_dir }}\\haproxy.zip"
    if (-not (Test-Path $dest)) {
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      # Download binary release port Windows
      Invoke-WebRequest -Uri "https://raw.githubusercontent.com/develar/haproxy-windows/master/haproxy-1.8.8-win64.zip" -OutFile $dest -UseBasicParsing
    }
  when: not haproxy_bin_check.stat.exists and (local_haproxy_zip is failed or not local_haproxy_zip.changed)
  ignore_errors: true

- name: Ekstrak arsip HAProxy ke C:\haproxy
  ansible.windows.win_shell: |
    if (Test-Path "{{ cache_dir }}\haproxy.zip") {
      Expand-Archive -Path "{{ cache_dir }}\haproxy.zip" -DestinationPath "{{ cache_dir }}\haproxy_extracted" -Force
      $bin = Get-ChildItem -Path "{{ cache_dir }}\haproxy_extracted" -Filter "haproxy.exe" -Recurse | Select-Object -First 1
      if ($bin) {
        Copy-Item -Path ($bin.DirectoryName + "\*") -Destination "{{ haproxy_dest_dir }}\" -Recurse -Force
      }
    }
  when: not haproxy_bin_check.stat.exists

# =====================================================
# 2. Setup NSSM (Service Manager)
# =====================================================
- name: Cek apakah binary NSSM sudah terpasang di HAProxy node
  ansible.windows.win_stat:
    path: "{{ tools_dir }}\\nssm\\nssm.exe"
  register: nssm_check_haproxy

- name: Salin binary nssm.exe ke HAProxy node
  ansible.windows.win_copy:
    src: "files/nssm.exe"
    dest: "{{ tools_dir }}\\nssm\\nssm.exe"
  when: not nssm_check_haproxy.stat.exists
  ignore_errors: true
  register: local_nssm_haproxy

- name: Unduh NSSM jika belum ada
  ansible.windows.win_shell: |
    $url = "https://nssm.cc/release/nssm-2.24.zip"
    $dest = "{{ cache_dir }}\\nssm.zip"
    if (-not (Test-Path $dest)) {
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
    }
    Expand-Archive -Path $dest -DestinationPath "{{ cache_dir }}\nssm_extracted" -Force
    Copy-Item "{{ cache_dir }}\nssm_extracted\nssm-2.24\win64\nssm.exe" -Destination "{{ tools_dir }}\nssm\nssm.exe" -Force
  when: not nssm_check_haproxy.stat.exists and (local_nssm_haproxy is failed or not local_nssm_haproxy.changed)

# =====================================================
# 3. Konfigurasi haproxy.cfg
# =====================================================
- name: Render file konfigurasi haproxy.cfg (Round Robin & Health Checks)
  ansible.windows.win_template:
    src: haproxy.cfg.j2
    dest: "{{ haproxy_dest_dir }}\\haproxy.cfg"
  notify: Restart HAProxy

# =====================================================
# 4. Daftarkan & Jalankan Service HAProxy
# =====================================================
- name: Cek status service HAProxy
  ansible.windows.win_service_info:
    name: HAProxy
  register: haproxy_service_check

- name: Daftarkan service HAProxy via NSSM
  ansible.windows.win_shell: |
    $nssm = "{{ tools_dir }}\nssm\nssm.exe"
    & $nssm install HAProxy "{{ haproxy_dest_dir }}\haproxy.exe" "-f {{ haproxy_dest_dir }}\haproxy.cfg"
    & $nssm set HAProxy AppDirectory "{{ haproxy_dest_dir }}"
    & $nssm set HAProxy Start SERVICE_AUTO_START
  when: not haproxy_service_check.exists

- name: Pastikan service HAProxy berjalan dan auto-start
  ansible.windows.win_service:
    name: HAProxy
    state: started
    start_mode: auto

- name: Buka port HTTP (80) dan Stats (8404) pada Windows Firewall
  ansible.windows.win_firewall_rule:
    name: "{{ item.name }}"
    localport: "{{ item.port }}"
    action: allow
    direction: in
    protocol: tcp
    state: present
    enabled: yes
  loop:
    - { name: "Allow-HTTP-Port-80", port: 80 }
    - { name: "Allow-HAProxy-Stats-8404", port: 8404 }
