---
# ==============================================================================
# Role: HAProxy (Load Balancer on Alpine Linux HAProxy Node 192.168.X.10)
# ==============================================================================

- name: Pasang paket HAProxy di Alpine Linux
  ansible.builtin.package:
    name: haproxy
    state: present

- name: Pastikan direktori konfigurasi HAProxy tersedia
  ansible.builtin.file:
    path: /etc/haproxy
    state: directory
    mode: '0755'

- name: Render file konfigurasi haproxy.cfg (Round Robin & Health Checks)
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: '0644'
  notify: Restart HAProxy

- name: Pastikan layanan HAProxy berjalan dan auto-start saat booting
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: yes
