---
# ==============================================================================
# Role: Database (MariaDB 10.x on Alpine Linux DB01 Node)
# ==============================================================================

- name: Pasang paket MariaDB Server dan Client di Alpine Linux
  ansible.builtin.package:
    name:
      - mariadb
      - mariadb-client
    state: present

- name: Cek apakah direktori database MariaDB sudah terinisialisasi
  ansible.builtin.stat:
    path: /var/lib/mysql/mysql
  register: mariadb_datadir_check

- name: Inisialisasi direktori data MariaDB
  ansible.builtin.command:
    cmd: mariadb-install-db --user=mysql --datadir=/var/lib/mysql
  when: not mariadb_datadir_check.stat.exists

- name: Pastikan MariaDB mengizinkan koneksi jaringan (bind-address = 0.0.0.0)
  ansible.builtin.lineinfile:
    path: /etc/my.cnf.d/mariadb-server.cnf
    regexp: '^#?bind-address'
    line: 'bind-address = 0.0.0.0'
    insertafter: '^\[mysqld\]'
  notify: Restart MariaDB

- name: Pastikan service MariaDB aktif dan berjalan saat startup
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: yes

- name: Render template SQL inisialisasi user dan database KopDes
  ansible.builtin.template:
    src: init_db.sql.j2
    dest: /tmp/init_db.sql
    mode: '0600'
  register: init_sql_result

- name: Terapkan inisialisasi database dan user KopDes
  ansible.builtin.shell: |
    if mysql -u root -p"{{ db_root_password }}" -e "SELECT 1;" >/dev/null 2>&1; then
      mysql -u root -p"{{ db_root_password }}" < /tmp/init_db.sql
    else
      mysql -u root < /tmp/init_db.sql
    fi
  when: init_sql_result.changed or not mariadb_datadir_check.stat.exists

- name: Cek apakah tabel kopdes sudah ada di database (Pemeriksaan Idempotensi)
  ansible.builtin.shell: |
    mysql -u root -p"{{ db_root_password }}" -N -e "SHOW TABLES IN {{ db_name }} LIKE 'kopdes';"
  register: kopdes_table_check
  changed_when: false
  failed_when: false

- name: Salin file skema dan data seed KopDes ke server database
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/tmp/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: "../database/schema.sql", dest: "schema.sql" }
    - { src: "../database/seed.sql", dest: "seed.sql" }
  when: kopdes_table_check.stdout | trim != 'kopdes'

- name: Import skema awal KopDes (schema.sql) secara idempotent
  ansible.builtin.shell: |
    mysql -u root -p"{{ db_root_password }}" {{ db_name }} < /tmp/schema.sql
  when: kopdes_table_check.stdout | trim != 'kopdes'

- name: Import data seed awal KopDes (seed.sql) secara idempotent
  ansible.builtin.shell: |
    mysql -u root -p"{{ db_root_password }}" {{ db_name }} < /tmp/seed.sql
  when: kopdes_table_check.stdout | trim != 'kopdes'
