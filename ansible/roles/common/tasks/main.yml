---
# ==============================================================================
# Role: Common (Baseline Alpine Linux Configuration for All 4 VMs)
# ==============================================================================

- name: Pastikan repositori apk terbaru dan Python 3 terpasang
  ansible.builtin.raw: apk update && apk add --no-cache python3 curl ca-certificates openrc
  changed_when: false

- name: Pastikan direktori kerja aplikasi dan log tersedia
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ app_dest_dir }}"
    - "/var/log/kopdes"
