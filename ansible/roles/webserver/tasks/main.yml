---
# ==============================================================================
# Role: Webserver (PHP Runtime & KopDes Application on Alpine Linux)
# ==============================================================================

- name: Pasang runtime PHP dan ekstensi yang dibutuhkan di Alpine Linux
  ansible.builtin.package:
    name:
      - php
      - php-cli
      - php-pdo
      - php-pdo_mysql
      - php-pdo_sqlite
      - php-session
      - php-json
      - php-curl
      - php-openssl
      - php-mbstring
      - php-tokenizer
      - php-ctype
    state: present

- name: Pastikan direktori aplikasi dan log KopDes tersedia
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ app_dest_dir }}"
    - "/var/log/kopdes"

- name: Deploy direktori source code KopDes dari repository
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: "{{ app_dest_dir }}/"
    mode: '0755'
  loop:
    - config
    - database
    - includes
    - pages
    - public

- name: Inject file konfigurasi .env sesuai identitas node ({{ server_node_name | default(inventory_hostname) }})
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dest_dir }}/.env"
    mode: '0644'
  notify: Restart KopDesWeb

- name: Deteksi direktori konfigurasi PHP aktif di Alpine Linux
  ansible.builtin.shell: |
    for d in /etc/php8* /etc/php8; do
      if [ -d "$d" ]; then
        echo "$d"
      fi
    done
  register: php_dirs
  changed_when: false
  failed_when: false

- name: Konfigurasi php.ini runtime PHP pada node web Alpine Linux
  ansible.builtin.template:
    src: php.ini.j2
    dest: "{{ item }}/php.ini"
    mode: '0644'
  loop: "{{ ((php_dirs.stdout_lines | default([])) + ['/etc/php8']) | unique }}"
  failed_when: false
  notify: Restart KopDesWeb

- name: Pasang skrip layanan OpenRC untuk web server KopDes
  ansible.builtin.template:
    src: kopdes.initd.j2
    dest: /etc/init.d/kopdes
    mode: '0755'
  notify: Restart KopDesWeb

- name: Pastikan layanan web server KopDes aktif dan berjalan saat booting
  ansible.builtin.service:
    name: kopdes
    state: started
    enabled: yes
